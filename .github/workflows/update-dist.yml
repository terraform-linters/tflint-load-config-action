on:
  push:
    branches: main
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - id: node-version
        uses: bendrucker/github-action-node-version@v1.0.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update dist
        run: npm run build && npm run package
      - uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Update dist
          file_pattern: dist/*
