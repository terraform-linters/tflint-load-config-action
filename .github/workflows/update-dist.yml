on:
  push:
    branches: main
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - id: node-version
        uses: bendrucker/github-action-node-version@a4a29b4a035acb713166f8bbaffa2c0265c8109b # v1.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update dist
        run: npm run build && npm run package
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Update dist
          file_pattern: dist/*
