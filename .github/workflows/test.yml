name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node-version
        uses: bendrucker/github-action-node-version@a4a29b4a035acb713166f8bbaffa2c0265c8109b # v1.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm run all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: load-config
        uses: ./
        with:
          source-repo: ${{ github.repository }}
          source-path: fixtures/.tflint.hcl
          source-ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: diff <(cat "${{ steps.load-config.outputs.path }}") fixtures/.tflint.hcl
