name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: node-version
        uses: bendrucker/github-action-node-version@v1.0.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm run all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: load-config
        uses: ./
        with:
          source-repo: ${{ github.repository }}
          source-path: fixtures/.tflint.hcl
          source-ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: diff <(cat "${{ steps.load-config.outputs.path }}") fixtures/.tflint.hcl
